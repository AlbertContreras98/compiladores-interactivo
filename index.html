<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compiladores · práctica interactiva</title>
<meta name="theme-color" content="#17203a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #f4f5f7; --card: #fff; --ink: #1d2433; --muted: #5f6b7a; --line: #dde1e7;
  --accent: #2f5bea; --accent-ink: #fff; --accent-soft: #e8eefe;
  --ok: #1d8a4c; --ok-soft: #e3f5ea; --bad: #c53030; --bad-soft: #fdeaea; --warn: #9a6700; --warn-soft: #fff4d6;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.45; font-size: 15px; }
header.top { background: #17203a; color: #fff; padding: 12px 18px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 20; }
header.top h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
header.top .sub { color: #aab4cf; font-size: 13px; }
header.top .spacer { flex: 1; }
header.top button.menu { display: none; background: transparent; border: 1px solid #44507a; color: #fff; padding: 6px 10px; border-radius: 8px; margin: 0; font-size: 15px; }
.layout { display: grid; grid-template-columns: 290px 1fr; gap: 0; min-height: calc(100vh - 52px); }
nav.side { background: #fff; border-right: 1px solid var(--line); padding: 10px 0 40px; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px; }
nav.side .blk { padding: 12px 16px 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 700; }
nav.side a { display: flex; align-items: center; gap: 8px; padding: 7px 16px; color: var(--ink); text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
nav.side a:hover { background: #f3f5fa; }
nav.side a.on { background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
nav.side a .dot { width: 9px; height: 9px; border-radius: 50%; background: #d4d9e2; flex: none; }
nav.side a .dot.p1 { background: #f2c94c; } nav.side a .dot.p2 { background: #6fcf97; } nav.side a .dot.p3 { background: var(--ok); }
nav.side a .exam { font-size: 10px; background: #ffe8cc; color: #8a4b00; padding: 1px 6px; border-radius: 10px; margin-left: auto; font-weight: 700; }
main { padding: 18px 22px 60px; max-width: 1100px; width: 100%; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
.card h2 { margin: 0 0 6px; font-size: 20px; }
.card h3 { margin: 14px 0 6px; font-size: 16px; }
.muted { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
select, input[type=text], textarea { font: inherit; border: 1px solid #c8ced8; border-radius: 7px; padding: 6px 8px; background: #fff; color: var(--ink); }
textarea { font-family: var(--mono); font-size: 13.5px; width: 100%; line-height: 1.45; tab-size: 4; resize: vertical; }
input.mono, .mono { font-family: var(--mono); font-size: 13.5px; }
button { font: inherit; background: var(--accent); color: var(--accent-ink); border: 0; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
button:hover { filter: brightness(.94); }
button.ghost { background: #fff; color: var(--accent); border: 1px solid #c3cff7; }
button.warn { background: #fff; color: var(--warn); border: 1px solid #e7d39a; }
button.small { padding: 4px 9px; font-size: 13px; }
button:disabled { opacity: .5; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
pre, code { font-family: var(--mono); font-size: 13.5px; }
pre.box { background: #f7f8fb; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; white-space: pre; }
code.k { background: #eef1f6; padding: 1px 5px; border-radius: 4px; }
.msg { padding: 10px 12px; border-radius: 8px; margin-top: 10px; border: 1px solid; }
.msg.ok { background: var(--ok-soft); border-color: #a8dcbc; color: #134e2d; }
.msg.bad { background: var(--bad-soft); border-color: #f2b8b8; color: #7a1f1f; }
.msg.warn { background: var(--warn-soft); border-color: #ecd48c; color: #5c3d00; }
.msg.info { background: var(--accent-soft); border-color: #c3cff7; color: #1d3383; }
.msg ul { margin: 6px 0 0 18px; padding: 0; }
table.grid { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
table.grid th, table.grid td { border: 1px solid #cfd5df; padding: 4px 6px; text-align: center; }
table.grid th { background: #eef1f7; font-weight: 600; font-family: var(--mono); }
table.grid td input { width: 64px; border: 1px solid transparent; text-align: center; padding: 4px; font-family: var(--mono); font-size: 13px; background: transparent; }
table.grid td input:focus { border-color: var(--accent); background: #fff; outline: none; }
table.grid td.ok, table.grid td input.ok { background: var(--ok-soft); }
table.grid td.bad, table.grid td input.bad { background: var(--bad-soft); }
table.grid td.left, table.grid th.left { text-align: left; }
.scroll { overflow-x: auto; }
.setrow { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 10px; align-items: center; margin: 6px 0; }
.setrow input { width: 100%; font-family: var(--mono); }
.setrow input.ok { border-color: var(--ok); background: var(--ok-soft); }
.setrow input.bad { border-color: var(--bad); background: var(--bad-soft); }
.theory { font-size: 14.5px; }
.theory h4 { margin: 14px 0 4px; font-size: 15px; }
.theory p { margin: 6px 0; }
.theory ul { margin: 4px 0 4px 20px; padding: 0; }
.theory .tip { background: var(--warn-soft); border-left: 4px solid #e2b33c; padding: 8px 10px; border-radius: 6px; margin: 8px 0; }
details.theorybox > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: #fbfcfe; }
.step.done { border-color: #a8dcbc; background: #f6fcf8; }
.step .stitle { font-weight: 600; margin-bottom: 6px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #eef1f6; color: var(--muted); margin-right: 4px; }
.opts label { display: block; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; margin: 5px 0; cursor: pointer; background: #fff; }
.opts label:hover { background: #f6f8fc; }
.opts label.ok { background: var(--ok-soft); border-color: #a8dcbc; }
.opts label.bad { background: var(--bad-soft); border-color: #f2b8b8; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 120px; }
.stat b { font-size: 22px; display: block; }
.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.home-grid a { display: block; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; color: var(--ink); text-decoration: none; }
.home-grid a:hover { border-color: #b6c4f2; }
.home-grid a small { color: var(--muted); display: block; margin-top: 4px; }
.tree { font-family: var(--mono); font-size: 13px; white-space: pre; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tokens { font-family: var(--mono); font-size: 12.5px; line-height: 1.8; }
.tokens span { display: inline-block; background: #eef1f6; border-radius: 4px; padding: 0 5px; margin: 1px 2px; }
.tokens span.bad { background: var(--bad-soft); color: var(--bad); }
.kbd { font-family: var(--mono); background: #eef1f6; border: 1px solid #d5dae3; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 12px; }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  nav.side { position: fixed; left: 0; top: 52px; bottom: 0; width: 290px; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 16px rgba(0,0,0,.12); }
  nav.side.open { transform: none; }
  header.top button.menu { display: inline-block; }
  main { padding: 12px 10px 60px; }
  .split { grid-template-columns: 1fr; }
  .card { padding: 12px; }
  table.grid td input { width: 48px; }
}
.layout > *, main, .card { min-width: 0; }
main { overflow-x: hidden; }
.controls label { max-width: 100%; min-width: 0; }
select { max-width: 100%; min-width: 0; }

</style>

<body>
<noscript>Esta app necesita JavaScript.</noscript>
<script>
// ---- src/core/regex.js ----
// ===== Motor de expresiones regulares con la sintaxis de JLex =====
// AST → AFN de Thompson con aristas de conjuntos de caracteres; equivalencia exacta vía AFD.
(function (root) {
  const MAXC = 0xFFFF;
  // Conjuntos de caracteres como listas de rangos [lo,hi] ordenadas y disjuntas
  const CS = {
    norm(rs) {
      rs = rs.filter(r => r[0] <= r[1]).sort((a, b) => a[0] - b[0]);
      const out = [];
      for (const r of rs) { const l = out[out.length - 1]; if (l && r[0] <= l[1] + 1) l[1] = Math.max(l[1], r[1]); else out.push([r[0], r[1]]); }
      return out;
    },
    neg(rs) { rs = CS.norm(rs); const out = []; let lo = 0; for (const r of rs) { if (r[0] > lo) out.push([lo, r[0] - 1]); lo = r[1] + 1; } if (lo <= MAXC) out.push([lo, MAXC]); return out; },
    has(rs, c) { for (const r of rs) if (c >= r[0] && c <= r[1]) return true; return false; },
    ch(c) { const k = typeof c === 'number' ? c : c.charCodeAt(0); return [[k, k]]; },
    caseFold(rs) {
      const extra = [];
      for (const [lo, hi] of rs) for (let c = Math.max(lo, 65); c <= Math.min(hi, 122); c++) {
        const s = String.fromCharCode(c);
        const u = s.toUpperCase().charCodeAt(0), l = s.toLowerCase().charCodeAt(0);
        extra.push([u, u], [l, l]);
      }
      return CS.norm([...rs, ...extra]);
    }
  };

  class RegexError extends Error { constructor(msg, pos) { super(msg); this.pos = pos; } }

  // ---------- Parser ----------
  // opts.macros: {nombre: textoER}; opts.inRule: si true, un espacio sin comillas termina la ER (como en JLex)
  function parse(src, opts = {}) {
    const macros = opts.macros || {};
    let i = 0;
    const warnings = [];
    const peek = () => src[i];
    const eof = () => i >= src.length;
    function err(m) { throw new RegexError(m + ' (posición ' + (i + 1) + ')', i); }

    function parseEscape() {
      // ya consumida la '\'
      if (eof()) err('Barra invertida al final');
      const c = src[i++];
      const map = { n: 10, t: 9, b: 8, r: 13, f: 12 };
      if (c in map) return map[c];
      if (/[0-7]/.test(c)) { let s = c; while (s.length < 3 && /[0-7]/.test(peek())) s += src[i++]; return parseInt(s, 8); }
      if (c === 'x') { const h = src.substr(i, 2); if (!/^[0-9a-fA-F]{2}$/.test(h)) err('\\x necesita dos dígitos hexadecimales'); i += 2; return parseInt(h, 16); }
      if (c === 'u') { const h = src.substr(i, 4); if (!/^[0-9a-fA-F]{4}$/.test(h)) err('\\u necesita cuatro dígitos hexadecimales'); i += 4; return parseInt(h, 16); }
      if (c === '^') { const k = src[i++]; return k.toUpperCase().charCodeAt(0) - 64; }
      return c.charCodeAt(0);
    }
    function parseAlt() {
      const alts = [parseCat()];
      while (peek() === '|') { i++; alts.push(parseCat()); }
      return alts.length === 1 ? alts[0] : { t: 'alt', a: alts };
    }
    function parseCat() {
      const items = [];
      while (!eof() && peek() !== '|' && peek() !== ')') {
        if (/\s/.test(peek())) {
          if (opts.inRule) break;
          warnings.push('Hay un espacio sin comillas: en JLex el espacio termina la expresión regular. Si quieres un espacio, escribe " " o \\040.');
          i++; continue;
        }
        items.push(parsePost());
      }
      if (!items.length) return { t: 'eps' };
      return items.length === 1 ? items[0] : { t: 'cat', a: items };
    }
    function parsePost() {
      let a = parseAtom();
      while (!eof() && '*+?'.includes(peek())) {
        const op = src[i++];
        a = { t: op === '*' ? 'star' : op === '+' ? 'plus' : 'opt', a };
      }
      return a;
    }
    function parseAtom() {
      const c = peek();
      if (c === '(') {
        i++; const e = parseAlt();
        if (peek() !== ')') err('Falta cerrar el paréntesis');
        i++; return e;
      }
      if (c === '[') return parseClass();
      if (c === '"') {
        i++; const chars = [];
        while (!eof() && peek() !== '"') {
          if (peek() === '\\') { i++; chars.push(parseEscape()); } else chars.push(src.charCodeAt(i++));
        }
        if (eof()) err('Faltan las comillas de cierre');
        i++;
        if (!chars.length) return { t: 'eps' };
        return chars.length === 1 ? { t: 'set', s: CS.ch(chars[0]) } : { t: 'cat', a: chars.map(k => ({ t: 'set', s: CS.ch(k) })) };
      }
      if (c === '\\') { i++; return { t: 'set', s: CS.ch(parseEscape()) }; }
      if (c === '.') { i++; return { t: 'set', s: CS.neg(CS.ch(10)) }; }
      if (c === '{') {
        const j = src.indexOf('}', i);
        if (j < 0) err('Llave { sin cerrar');
        const name = src.slice(i + 1, j);
        if (/^\d+(,\d*)?$/.test(name)) err('JLex no admite repeticiones {' + name + '}: las llaves sirven para usar macros. Repite la subexpresión a mano');
        if (!(name in macros)) err('Macro {' + name + '} no definida');
        i = j + 1;
        const sub = parse(macros[name], { macros, depth: (opts.depth || 0) + 1, lenient: true });
        if ((opts.depth || 0) > 20) err('Macros recursivas');
        return sub.ast;
      }
      if (c === '*' || c === '+' || c === '?') err('Operador "' + c + '" sin nada delante');
      if (c === '^' && i === 0) err('El ancla ^ (inicio de línea) no se practica en esta app');
      if (c === '$' && i === src.length - 1) err('El ancla $ (fin de línea) no se practica en esta app');
      if (c === ']' ) err('Corchete ] sin abrir');
      if (c === '}' ) err('Llave } sin abrir');
      i++;
      return { t: 'set', s: CS.ch(c) };
    }
    function parseClass() {
      i++; // [
      let negate = false;
      if (peek() === '^') { negate = true; i++; }
      const rs = [];
      let first = true;
      while (!eof() && (peek() !== ']' || false)) {
        let lo;
        if (peek() === '"') {
          i++;
          while (!eof() && peek() !== '"') { const k = peek() === '\\' ? (i++, parseEscape()) : src.charCodeAt(i++); rs.push([k, k]); }
          if (eof()) err('Faltan comillas de cierre dentro de [ ]');
          i++; first = false; continue;
        }
        if (peek() === '\\') { i++; lo = parseEscape(); } else lo = src.charCodeAt(i++);
        if (peek() === '-' && src[i + 1] !== ']' && i + 1 < src.length) {
          i++;
          let hi; if (peek() === '\\') { i++; hi = parseEscape(); } else hi = src.charCodeAt(i++);
          if (hi < lo) err('Rango invertido ' + String.fromCharCode(lo) + '-' + String.fromCharCode(hi));
          rs.push([lo, hi]);
        } else rs.push([lo, lo]);
        first = false;
      }
      if (eof()) err('Falta el corchete de cierre ]');
      i++;
      const s = CS.norm(rs);
      return { t: 'set', s: negate ? CS.neg(s) : s };
    }
    const ast = parseAlt();
    if (!eof()) {
      if (peek() === ')' && opts.lenient && i === src.length - 1) { warnings.push('Paréntesis ) sobrante al final: JLex lo tolera, pero sobra'); return { ast, warnings, rest: '' }; }
      if (peek() === ')') err('Paréntesis ) sin abrir');
      if (opts.inRule) return { ast, rest: src.slice(i), warnings };
      err('Carácter inesperado');
    }
    return { ast, warnings, rest: '' };
  }

  // ---------- AFN de Thompson ----------
  function buildNFA(ast, ignoreCase) {
    const st = []; // cada estado: {eps:[], edges:[[set,to]]}
    const ns = () => { st.push({ eps: [], edges: [] }); return st.length - 1; };
    function b(n) {
      switch (n.t) {
        case 'eps': { const s = ns(), e = ns(); st[s].eps.push(e); return [s, e]; }
        case 'set': { const s = ns(), e = ns(); st[s].edges.push([ignoreCase ? CS.caseFold(n.s) : n.s, e]); return [s, e]; }
        case 'cat': { let [s, e] = b(n.a[0]); for (let k = 1; k < n.a.length; k++) { const [s2, e2] = b(n.a[k]); st[e].eps.push(s2); e = e2; } return [s, e]; }
        case 'alt': { const s = ns(), e = ns(); for (const x of n.a) { const [s2, e2] = b(x); st[s].eps.push(s2); st[e2].eps.push(e); } return [s, e]; }
        case 'star': { const s = ns(), e = ns(); const [s2, e2] = b(n.a); st[s].eps.push(s2, e); st[e2].eps.push(s2, e); return [s, e]; }
        case 'plus': { const s = ns(), e = ns(); const [s2, e2] = b(n.a); st[s].eps.push(s2); st[e2].eps.push(s2, e); return [s, e]; }
        case 'opt': { const s = ns(), e = ns(); const [s2, e2] = b(n.a); st[s].eps.push(s2, e); st[e2].eps.push(e); return [s, e]; }
      }
    }
    const [start, accept] = b(ast);
    return { st, start, accept };
  }
  function epsClose(nfa, set) {
    const out = new Set(set); const stack = [...set];
    while (stack.length) { const s = stack.pop(); for (const t of nfa.st[s].eps) if (!out.has(t)) { out.add(t); stack.push(t); } }
    return out;
  }
  function step(nfa, set, c) {
    const out = new Set();
    for (const s of set) for (const [cs, t] of nfa.st[s].edges) if (CS.has(cs, c)) out.add(t);
    return epsClose(nfa, out);
  }
  function compile(src, opts = {}) {
    const p = parse(src, opts);
    const nfa = buildNFA(p.ast, opts.ignoreCase);
    return { src, ast: p.ast, nfa, warnings: p.warnings };
  }
  function matches(re, str) {
    let cur = epsClose(re.nfa, [re.nfa.start]);
    for (let k = 0; k < str.length; k++) { cur = step(re.nfa, cur, str.charCodeAt(k)); if (!cur.size) return false; }
    return cur.has(re.nfa.accept);
  }
  // longitud del prefijo más largo de str (desde pos) que encaja; -1 si ninguno
  function longestPrefix(re, str, pos = 0) {
    let cur = epsClose(re.nfa, [re.nfa.start]); let best = cur.has(re.nfa.accept) ? 0 : -1;
    for (let k = pos; k < str.length; k++) {
      cur = step(re.nfa, cur, str.charCodeAt(k)); if (!cur.size) break;
      if (cur.has(re.nfa.accept)) best = k - pos + 1;
    }
    return best;
  }

  // ---------- Equivalencia exacta ----------
  function allSets(nfa) { const out = []; for (const s of nfa.st) for (const [cs] of s.edges) out.push(cs); return out; }
  function partition(sets) {
    const cuts = new Set([0, MAXC + 1]);
    for (const rs of sets) for (const [lo, hi] of rs) { cuts.add(lo); cuts.add(hi + 1); }
    const c = [...cuts].sort((a, b) => a - b);
    const classes = [];
    for (let k = 0; k < c.length - 1; k++) classes.push([c[k], c[k + 1] - 1]);
    // primero las clases con un representante "bonito", para que los contraejemplos se lean bien
    const score = cl => { const r = repr(cl); const k = NICE.indexOf(r); return k >= 0 ? k : (r.charCodeAt(0) >= 33 && r.charCodeAt(0) <= 126 ? 100 : r === '\n' ? 150 : 200); };
    return classes.map(cl => [cl, score(cl)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
  }
  const NICE = 'abcxyzABCXYZ0123456789_.-+*/@ #!?,;:=<>()[]{}"\'\\|&%$^~`';
  function repr(cl) {
    for (const ch of NICE) { const k = ch.charCodeAt(0); if (k >= cl[0] && k <= cl[1]) return ch; }
    for (let k = Math.max(cl[0], 33); k <= Math.min(cl[1], 126); k++) return String.fromCharCode(k);
    if (cl[0] <= 10 && cl[1] >= 10) return '\n';
    if (cl[0] <= 9 && cl[1] >= 9) return '\t';
    if (cl[0] <= 255) { for (let k = Math.max(cl[0], 161); k <= Math.min(cl[1], 255); k++) return String.fromCharCode(k); }
    return String.fromCharCode(cl[0]);
  }
  // Devuelve {equal, example, inA} con example = cadena más corta en la que difieren
  function equivalent(a, b, maxStates = 20000) {
    const classes = partition([...allSets(a.nfa), ...allSets(b.nfa)]);
    const reps = classes.map(cl => cl[0]);
    const key = s => [...s].sort((x, y) => x - y).join(',');
    const sa = epsClose(a.nfa, [a.nfa.start]), sb = epsClose(b.nfa, [b.nfa.start]);
    const seen = new Set([key(sa) + '|' + key(sb)]);
    const queue = [[sa, sb, '']];
    while (queue.length) {
      const [x, y, w] = queue.shift();
      const ax = x.has(a.nfa.accept), by = y.has(b.nfa.accept);
      if (ax !== by) return { equal: false, example: w, inA: ax };

  ];
  const MODS = { all: 'Todo el temario', gen: 'Visión general', lex: 'Análisis léxico y JLex', sin: 'Análisis sintáctico y CUP', sem: 'Semántica y código intermedio', sint: 'Síntesis y optimización' };

    create(ctx) {

        check() {

  // ===================== Clasificación de errores =====================
  const ERRS = [

    ['printf("hola);', 0, 'La cadena no se cierra: el analizador léxico llega al final de la línea dentro de una cadena.'],
    ['float r = 2.12.1;', 0, 'Número mal formado (el módulo pone 2.12.1 como ejemplo de número inválido).'],
    ['int h\'24 = 0;', 0, 'Nombre de identificador con caracteres no válidos.'],
    ['/* comentario sin cerrar …  (fin del fichero)', 0, 'Se llega al final del fichero en medio de un componente léxico.'],
    ['long n = 99999999999999999999999;', 0, 'Constante demasiado grande: desbordamiento al convertir el lexema en número.'],
    ['x = a + * b;', 1, 'Todos los testigos son válidos, pero la secuencia "+ *" no encaja en la gramática de las expresiones.'],
    ['if (x > 3 { y = 1; }', 1, 'Paréntesis mal equilibrados.'],
    ['int a = 5', 1, 'Falta el punto y coma final.'],
    ['while x < 10) x++;', 1, 'Falta el paréntesis de apertura tras while.'],
    ['int = 5;', 1, 'Falta el identificador en la declaración.'],
    ['for (i = 0; i < 10) i++;', 1, 'El for necesita tres partes separadas por ;.'],
    ['y = z + 1;   // z no se ha declarado', 2, 'Variable no declarada: es una comprobación dependiente del contexto.'],
    ['int x = "hola";', 2, 'Incompatibilidad de tipos: se asigna una cadena a un entero.'],
    ['int a; float a;', 2, 'Declaración duplicada del mismo identificador en el mismo ámbito.'],

    ['SERVER s1 { … }  SERVER s1 { … }   (PEC3)', 2, 'DUPLICATE_SERVER_DECLARATION: dos servidores con el mismo nombre. Es semántico: la sintaxis es correcta.'],

  const ECLASS = ['Léxico', 'Sintáctico', 'Semántico', 'De ejecución'];
  App.register({

    intro: 'Indica en qué fase se detecta cada error.', levels: ['medium'],
    theory: `<p>Cada fase detecta sus propios errores:</p><ul>
      <li><b>Léxico</b>: caracteres o lexemas que no encajan con ningún patrón: símbolos ajenos al lenguaje, números mal formados o demasiado grandes, cadenas o comentarios sin cerrar, identificadores con caracteres no permitidos.</li>
      <li><b>Sintáctico</b>: testigos correctos en un orden que la gramática no permite: paréntesis desequilibrados, falta de punto y coma, expresiones mal construidas.</li>

  function tbox(kind, a) {

  App.register({
    id: 'tombstone', block: 'fund', title: 'Diagramas de Tombstone', short: 'Compiladores, programas y máquinas en T',
    intro: 'Combina los diagramas y responde qué se obtiene. Un compilador se escribe <b>fuente → objeto (implementación)</b>.',
    levels: ['easy', 'medium', 'hard'],
    theory: `<h4>Diagramas básicos</h4><ul>
      <li><b>Programa</b> P escrito en el lenguaje L.</li>
      <li><b>Máquina</b> M: ejecuta programas escritos en su código máquina M.</li>
      <li><b>Compilador</b> (la T): traduce del lenguaje fuente L1 al objeto L2 y está escrito (implementado) en L3. Lo abreviamos <span class="mono">L1 → L2 (L3)</span>.</li>
      <li><b>Intérprete</b> de L escrito en M.</li></ul>
      <h4>Reglas de unión</h4><ul>
      <li>Un programa en M solo se ejecuta sobre la máquina M.</li>
      <li>Para compilar P escrito en L1 hace falta un compilador cuyo fuente sea L1; el compilador debe estar escrito en el lenguaje de la máquina donde se ejecuta; el resultado es P escrito en el lenguaje objeto L2.</li>

      <li><b>Compilador interpretativo</b>: compila a un código intermedio y lo ejecuta un intérprete (Java y la JVM).</li></ul>

    create(ctx) {
      const L = U.sample(LANGS, 3), M = U.sample(MACH, 2);
      let desc, ask, answer, explain;

        answer = () => s.value === (valid ? M[0] : 'No se puede compilar');

      } else if (ctx.level === 'medium') {
        const a = { src: L[0], tgt: M[1], impl: L[1] };
        const b = { src: L[1], tgt: M[0], impl: M[0] };
        desc = `Tenemos el código fuente de un compilador <b class="mono">${a.src} → ${a.tgt} (${a.impl})</b> y lo compilamos con <b class="mono">${b.src} → ${b.tgt} (${b.impl})</b> en una máquina ${M[0]}.`;
        const opts = [...new Set([L[0], L[1], M[0], M[1]])];
        const s1 = sel(opts), s2 = sel(opts), s3 = sel(opts);
        const cross = U.choice(['Es un compilador cruzado', 'Es un compilador nativo']);
        ask = h('div', null, h('p', null, 'Obtenemos el compilador: fuente ', s1, ' → objeto ', s2, ' escrito en ', s3), cross.el);
        answer = () => { cross.mark([0]); return s1.value === a.src && s2.value === a.tgt && s3.value === M[0] && cross.selected()[0] === 0; };
        explain = `Compilar un compilador solo cambia su lenguaje de implementación: ${a.src} → ${a.tgt} (${M[0]}). Se ejecuta en ${M[0]} y genera código para ${M[1]}, así que es <b>cruzado</b>.`;
      } else {
        // escenario tipo PEC1
        const src = L[0], host = M[0], target = M[1], impl = L[1];
        desc = `Queremos ejecutar el programa P escrito en <b>${src}</b> en una máquina <b>${target}</b>. Disponemos de: (1) un compilador <span class="mono">${src} → ${host} (${host})</span>; (2) un compilador <span class="mono">${impl} → ${target} (${host})</span>; (3) el código fuente de un compilador <span class="mono">${src} → ${target} (${impl})</span>; y de máquinas ${host} y ${target}.`;
        const opts = [...new Set([src, impl, host, target])];
        const s1 = sel(opts), s2 = sel(opts), s3 = sel(opts), s4 = sel(['(1)', '(2)', '(3)']), s5 = sel(opts);
        ask = h('div', null,
          h('p', null, 'Paso 1: compilo (3) con el compilador ', s4, ' y obtengo: ', s1, ' → ', s2, ' escrito en ', s3),
          h('p', null, 'Paso 2: compilo P con lo obtenido en el paso 1 (ejecutándolo en ' + host + '). P queda escrito en ', s5));
        answer = () => s4.value === '(2)' && s1.value === src && s2.value === target && s3.value === host && s5.value === target;
        explain = `(3) está escrito en ${impl}, así que se compila con (2), ${impl} → ${target} (${host}), en la máquina ${host}. Resultado: ${src} → ${target} (${host}), un compilador cruzado. Con él, en ${host}, P se traduce a ${target} y ya se ejecuta en la máquina ${target}. (El compilador (1) sirve para ejecutar P en ${host}, no en ${target}.)`;
      }
      return {
        statement: h('div', { html: '<p>' + desc + '</p>' }),
        body: ask,
        check() { return answer() ? { ok: true, html: '¡Correcto! ' + explain } : { ok: false, html: 'No es correcto. Repasa las reglas de unión (pestaña de teoría).' }; },
        solution() { return h('p', { html: explain }); }
      };
    }
  });
})();

  function mutate(s, alphabet) {
    const ops = [
      () => s.slice(0, -1),
      () => s.slice(1),
      () => s + U.pick(alphabet),
      () => { if (!s) return U.pick(alphabet); const i = U.R(s.length); return s.slice(0, i) + U.pick(alphabet) + s.slice(i + 1); },
      () => { if (s.length < 2) return s + s; const i = U.R(s.length - 1); return s.slice(0, i) + s[i + 1] + s[i] + s.slice(i + 2); },
      () => U.pick(alphabet) + s
    ];
    return U.pick(ops)();
  }

  const T_JLEX = `
    <h4>Estructura de un fichero JLex</h4>
    <pre class="box">código de usuario (imports)
%%
directivas (%cup, %line, %ignorecase, %state…) y macros  NOMBRE=expresión
%%
reglas:   [&lt;ESTADOS&gt;] expresión   { acción Java }</pre>
    <h4>Cómo decide JLex qué regla aplica</h4>
    <ol>
      <li><b>Emparejamiento más largo</b>: de todas las reglas activas, gana la que reconoce el prefijo más largo de la entrada que queda.</li>
      <li><b>Empate</b>: si varias reconocen la misma longitud máxima, gana la que aparece <b>antes</b> en el fichero.</li>
      <li>Se ejecuta la acción: si hace <span class="mono">return</span>, se devuelve ese token al analizador sintáctico; si no devuelve nada (p. ej. espacios o comentarios), el texto se descarta y se sigue leyendo.</li>
    </ol>
    <p>Por eso las palabras reservadas se ponen <b>antes</b> que el identificador: con <span class="mono">if</span> empatan las dos y gana la primera; con <span class="mono">ifx</span> gana el identificador porque es más largo.</p>
    <h4>Estados léxicos</h4>
    <p>Con <span class="mono">%state COMENTARIO</span> se declara un estado. Una regla con <span class="mono">&lt;COMENTARIO&gt;</span> delante solo está activa en ese estado; una regla <b>sin lista de estados está activa en todos</b>. <span class="mono">yybegin(COMENTARIO)</span> cambia de estado; el inicial es <span class="mono">YYINITIAL</span>.</p>
    <h4>Otras directivas</h4>
    <ul><li><span class="mono">%cup</span>: integra el analizador con CUP (las acciones devuelven <span class="mono">new Symbol(sym.NOMBRE)</span>).</li><li><span class="mono">%line</span>: activa <span class="mono">yyline</span> (número de línea, empieza en 0).</li><li><span class="mono">%ignorecase</span>: el lenguaje no distingue mayúsculas de minúsculas.</li><li><span class="mono">yytext()</span>: el texto reconocido.</li></ul>`;

  function buildSpec(level) {
    const kwPool = [['if', 'IF'], ['while', 'WHILE'], ['int', 'INT'], ['else', 'ELSE'], ['for', 'FOR'], ['print', 'PRINT']];
    const kws = U.sample(kwPool, level === 'easy' ? 2 : 3);
    const opsPool = [['"<="', 'LE', '<='], ['"<"', 'LT', '<'], ['"=="', 'EQ', '=='], ['"="', 'ASIG', '='], ['"+"', 'MAS', '+'], ['"++"', 'INC', '++'], ['"*"', 'POR', '*'], ['"("', 'PAR_A', '('], ['")"', 'PAR_C', ')'], ['";"', 'PYC', ';']];
    let ops = U.sample(opsPool, level === 'easy' ? 3 : 5);
    // asegurar pares engañosos
    if (level !== 'easy' && !ops.some(o => o[1] === 'LE')) ops.push(opsPool[0], opsPool[1]);
    if (level !== 'easy' && Math.random() < 0.5 && !ops.some(o => o[1] === 'INC')) ops.push(opsPool[5], opsPool[4]);
    ops = ops.filter((o, k, a) => a.findIndex(x => x[1] === o[1]) === k);
    const rules = [];
    const idFirst = level !== 'easy' && Math.random() < 0.35;
    const kwRules = kws.map(([w, T]) => ({ re: '"' + w + '"', tok: T }));
    const idRule = { re: '[a-zA-Z][a-zA-Z0-9]*', tok: 'ID', value: true };
    if (idFirst) rules.push(idRule, ...kwRules); else rules.push(...kwRules, idRule);
    rules.push({ re: '[0-9]+', tok: 'NUM', value: true });
    if (level === 'hard' || level === 'veryhard') rules.push({ re: '[0-9]+"."[0-9]+', tok: 'REAL', value: true });
    const opRules = U.shuffle(ops).map(([re, T]) => ({ re, tok: T }));
    rules.push(...opRules);
    let states = [];
    if (level === 'veryhard') {
      states = ['COMENT'];
      rules.push({ re: '"/*"', begin: 'COMENT' }, { re: '"*/"', st: 'COMENT', begin: 'YYINITIAL' }, { re: '[^*]|"*"', st: 'COMENT', skip: true });
    } else if (level === 'hard') rules.push({ re: '"//"[^\\n]*', skip: true });
    rules.push({ re: '[ \\t\\n]+', skip: true });
    rules.push({ re: '.', err: true });
    const lines = ['import java_cup.runtime.Symbol;', '%%', '%cup', '%line'];
    if (states.length) lines.push('%state ' + states.join(', '));
    lines.push('%%');
    const fixInComent = r => r.st === undefined && states.length && !r.begin ? '<YYINITIAL> ' : '';
    for (const r of rules) {
      const pre = r.st ? '<' + r.st + '> ' : fixInComent(r);
      let act;
      if (r.tok) act = '{ return new Symbol(sym.' + r.tok + (r.value ? ', yytext()' : '') + '); }';
      else if (r.begin) act = '{ yybegin(' + r.begin + '); }';
      else if (r.err) act = '{ System.err.println("Error léxico: " + yytext()); }';
      else act = '{ }';
      lines.push(pre + r.re.padEnd(Math.max(20 - pre.length, 4)) + ' ' + act);
    }
    return { spec: lines.join('\n'), kws, ops, idFirst, states };
  }
  function buildInput(level, S) {
    const parts = [];
    const n = level === 'easy' ? 5 : level === 'medium' ? 7 : 9;
    const ids = ['x', 'cont', 'if2', 'whilex', 'a1', 'total', 'i'];
    for (let k = 0; k < n; k++) {
      const r = Math.random();
      if (r < 0.2) parts.push(U.pick(S.kws)[0]);
      else if (r < 0.32) parts.push(U.pick(S.kws)[0] + U.pick(['x', '1', 'a']));
      else if (r < 0.5) parts.push(U.pick(ids));
      else if (r < 0.62) parts.push(String(U.R(200)) + (level === 'hard' || level === 'veryhard' ? U.pick(['', '', '.5', 'abc']) : U.pick(['', '', 'x'])));
      else parts.push(U.pick(S.ops)[2] + (Math.random() < 0.25 ? U.pick(S.ops)[2] : ''));
    }
    if (level === 'hard') parts.splice(1 + U.R(parts.length - 1), 0, '// comentario ' + U.pick(S.kws)[0] + '\n');
    if (level === 'veryhard') parts.splice(1 + U.R(parts.length - 1), 0, '/* ' + U.pick(S.kws)[0] + ' * x */');
    if (level !== 'easy' && Math.random() < 0.5) parts.splice(U.R(parts.length), 0, U.pick(['#', '@', '$']));
    let s = '';
    parts.forEach((p, k) => { s += p; if (k < parts.length - 1) s += Math.random() < 0.55 ? ' ' : ''; });
    return s;
  }
  function expectedTokens(spec, input) {
    const r = Tools.runJLex(spec, input);
    const P = r.spec; const out = [];
    for (const t of r.trace) { const rule = P.rules[t.rule]; if (rule.token) out.push({ tok: rule.token, text: t.text }); else if (rule.isError) out.push({ tok: 'ERROR', text: t.text }); }
    for (const e of r.lexErrors) if (/ningún patrón/.test(e)) out.push({ tok: 'ERROR', text: '?' });
    return { list: out, trace: r.trace, P };
  }

          out.appendChild(h('div', { class: 'tokens' }, ...r.trace.map(t => { const rule = P.rules[t.rule]; return h('span', { class: rule.isError ? 'bad' : '', title: 'regla de la línea ' + rule.line }, (rule.token || (rule.isError ? 'ERROR' : '·')) + ' «' + t.text.replace(/\n/g, '\\n') + '»'); })));

          if (P.warnings.length) out.appendChild(h('div', { class: 'msg warn', html: P.warnings.map(esc).join('<br>') }));
        };

        return { statement: h('p', { class: 'muted' }, 'Los elementos marcados con · se reconocen pero no devuelven token (se ignoran).'), body: h('div', null, h('p', null, 'Entrada:'), inp, out) };
      }

        body: inp,

          const where = k < e.length ? 'El token nº ' + (k + 1) + ' es incorrecto: el texto <span class="mono">«' + esc(exp.list[k].text) + '»</span> ' + (got[k] ? 'no da ' + esc(got[k]) + '.' : 'falta.') : 'Te sobran tokens al final.';
          return { ok: false, html: 'Los ' + k + ' primeros están bien. ' + where + ' Recuerda: gana el prefijo más largo y, si empatan, la regla que va antes.' };
        },

          const d = div('');
          d.appendChild(h('p', null, exp.list.map(x => x.tok).join(' ')));
          d.appendChild(U.table(exp.trace.map((_, k) => String(k + 1)), ['Texto', 'Regla (línea)', 'Resultado'], (r, c) => { const t = exp.trace[r]; const rule = exp.P.rules[t.rule]; return [JSON.stringify(t.text), rule.reText, rule.token || (rule.isError ? 'ERROR' : rule.begin.length ? 'yybegin(' + rule.begin + ')' : 'se ignora')][c]; }));

          return d;
        }
      };
    }
  });
})();

// ===== Ejercicios de análisis sintáctico =====
(function () {
  const { h, div, btn, esc } = U;
  const EPS = Gram.EPS, END = Gram.END;

  // ---------- utilidades comunes ----------
  function grammarPre(g, opts = {}) {

  function stepBox(title, content, extra) {

  }

  // ---------- Teoría ----------
  const T_FF = `
    <h4>Primeros (FIRST)</h4>
    <p><b>Primeros(α)</b> es el conjunto de terminales por los que puede empezar una cadena derivada de α; incluye ε si α puede derivar la cadena vacía.</p>
    <ul>
      <li>Si X es terminal: Primeros(X) = { X }.</li>
      <li>Si X → ε es una regla: ε ∈ Primeros(X).</li>
      <li>Si X → Y<sub>1</sub>Y<sub>2</sub>…Y<sub>k</sub>: añade Primeros(Y<sub>1</sub>) − {ε}; si Y<sub>1</sub> puede ser ε, añade también Primeros(Y<sub>2</sub>) − {ε}, y así sucesivamente. Si <i>todos</i> pueden ser ε, añade ε.</li>
    </ul>
    <h4>Siguientes (FOLLOW)</h4>
    <p><b>Siguientes(A)</b> son los terminales que pueden aparecer justo a la derecha de A en alguna forma sentencial. <b>Nunca contiene ε</b>; en su lugar aparece el fin de cadena <b>#</b>.</p>
    <ul>
      <li># ∈ Siguientes(S), con S el axioma.</li>
      <li>Si A → α B β: añade Primeros(β) − {ε} a Siguientes(B).</li>
      <li>Si A → α B, o A → α B β con ε ∈ Primeros(β): añade Siguientes(A) a Siguientes(B).</li>
    </ul>
    <p>Se repite hasta que ningún conjunto cambie (punto fijo).</p>
    <div class="tip">Errores típicos: poner ε en Siguientes; olvidar que si Y<sub>1</sub> es anulable hay que seguir mirando Y<sub>2</sub>; olvidar el # del axioma; y no propagar Siguientes(A) → Siguientes(B) cuando B está al final.</div>`;
  const T_LL = `
    <h4>Conjunto de predicción</h4>
    <p>Para cada regla A → α:</p>
    <p class="mono">Pred(A → α) = (Primeros(α) − {ε}) ∪ (Siguientes(A) si ε ∈ Primeros(α))</p>
    <h4>Tabla de análisis descendente LL(1)</h4>
    <p>Filas: no terminales. Columnas: terminales y #. Para cada regla A → α y cada a ∈ Pred(A → α), se escribe la regla en la celda M[A, a]. Las celdas vacías son errores.</p>
    <h4>¿Es LL(1)?</h4>
    <p>Una gramática es LL(1) si y solo si, para cada no terminal, los conjuntos de predicción de sus reglas son <b>disjuntos dos a dos</b>; es decir, si ninguna celda de la tabla tiene dos reglas.</p>
    <p>Una gramática con <b>recursividad por la izquierda</b> o con <b>prefijos comunes</b> nunca es LL(1); tampoco una ambigua.</p>
    <h4>Algoritmo de análisis</h4>
    <p>Pila inicial: <span class="mono"># S</span> (cima a la derecha en esta app: se escribe la pila con la cima a la izquierda en la traza). En cada paso, con X en la cima y a el símbolo actual:</p>
    <ul><li>X = a = # → aceptar.</li><li>X terminal y X = a → extraer (se desapila y se avanza la entrada).</li><li>X no terminal → se consulta M[X, a]; si hay una regla X → Y<sub>1</sub>…Y<sub>k</sub> se sustituye X por Y<sub>1</sub>…Y<sub>k</sub> (Y<sub>1</sub> queda en la cima). Si está vacía → error.</li></ul>`;
  const T_LR0 = `
    <h4>Elementos LR(0)</h4>
    <p>Un elemento es una regla con un punto en la parte derecha: <span class="mono">A → α • β</span> indica que ya se ha visto α y se espera β. Para una regla A → ε solo existe el elemento <span class="mono">A → •</span>.</p>
    <h4>Gramática aumentada</h4>
    <p>Se añade la regla <span class="mono">S' → S #</span>. Las reglas originales se numeran desde 1 (la aumentada no lleva número).</p>
    <h4>Clausura(I)</h4>
    <p>Se parte de los elementos de I. Para cada elemento <span class="mono">A → α • B β</span> con B no terminal, se añaden todos los <span class="mono">B → • γ</span>. Se repite hasta que no se añada nada.</p>
    <h4>Ir_a(I, X)</h4>

    <h4>Colección canónica</h4>
    <ol><li>I0 = Clausura(S' → • S #).</li><li>Para cada estado, en orden, se calcula Ir_a con cada símbolo que aparece tras un punto: <b>primero los no terminales y después los terminales, en el orden de aparición en la gramática</b> (es el orden que usan los módulos y las soluciones).</li><li>Si el conjunto obtenido es nuevo, recibe el siguiente número; si ya existe, se reutiliza.</li><li>No se hace Ir_a con #: el elemento S' → S • # indica aceptación.</li></ol>
    <div class="tip">Truco: dos estados son el mismo si tienen exactamente los mismos elementos. Basta comparar el núcleo (los elementos que no vienen de la clausura).</div>`;
  const T_SLR = `
    <h4>Tabla de estados (transiciones)</h4>
    <p>Es la función Ir_a escrita como tabla: para cada estado y cada símbolo (terminal o no terminal), el estado al que se va.</p>
    <h4>Tabla SLR(1)</h4>
    <p>Columnas de <b>acción</b> (terminales y #) y de <b>Ir_a</b> (no terminales). Para cada estado I<sub>x</sub>:</p>
    <ul>
      <li>Si <span class="mono">A → α • a β</span> ∈ I<sub>x</sub> con a terminal e Ir_a(I<sub>x</sub>, a) = I<sub>k</sub>: <b>dk</b> (desplazar e ir a k).</li>
      <li>Si <span class="mono">A → α •</span> ∈ I<sub>x</sub> (punto al final, regla número n): <b>rn</b> en todas las columnas de <b>Siguientes(A)</b>.</li>
      <li>Si <span class="mono">S' → S • #</span> ∈ I<sub>x</sub>: <b>aceptar</b> (OK) en la columna #.</li>
      <li>Ir_a(I<sub>x</sub>, B) = I<sub>k</sub> con B no terminal: se escribe <b>k</b> en la columna B.</li>
    </ul>
    <h4>¿Es SLR(1)?</h4>
    <p>Lo es si ninguna celda tiene dos acciones. Un conflicto se escribe con las dos entradas, por ejemplo <span class="mono">d6/r3</span> (desplazamiento/reducción) o <span class="mono">r2/r5</span> (reducción/reducción). En un conflicto d/r la solución habitual es desplazar.</p>
    <div class="tip">En la app: escribe <b>d5</b>, <b>r2</b>, <b>OK</b> (o "aceptar") y los conflictos separados por /. En las columnas de no terminales, solo el número.</div>`;
  const T_TRACE_LR = `
    <h4>Algoritmo de análisis ascendente</h4>
    <p>Se usa una pila de estados que empieza con 0. Con s en la cima y a el símbolo actual, se mira Acción[s, a]:</p>
    <ul>
      <li><b>dk</b>: se apila k y se avanza en la entrada.</li>
      <li><b>rn</b> con la regla n: A → β: se desapilan |β| estados (tantos como símbolos tiene β; ninguno si β = ε). Con t en la cima, se apila Ir_a[t, A].</li>
      <li><b>OK</b>: se acepta la cadena.</li>
      <li>Celda vacía: error.</li>
    </ul>
    <div class="tip">Escribe la acción como <b>d5</b>, <b>r3</b>, <b>OK</b> o <b>error</b>.</div>`;

  // ---------- normalización de celdas ----------
  function normAction(s) {
    s = String(s || '').trim().toLowerCase();
    if (!s || s === '-' || s === '·') return [];
    return [...new Set(s.split(/[\/,;|]|\s+o\s+/).map(x => x.trim()).filter(Boolean).map(x => {
      x = x.replace(/\s+/g, '');

      m = x.match(/^(r|reducir|reduce)(\d+)$/); if (m) return 'r' + m[2];
      return '?' + x;
    }))].sort();
  }
  const sameArr = (a, b) => a.length === b.length && a.every((x, k) => x === b[k]);

  // ===================== Primeros y Siguientes =====================
  App.register({
    id: 'firstfollow', block: 'sin', exam: true, title: 'Primeros y Siguientes', short: 'Conjuntos FIRST y FOLLOW de cada no terminal',
    intro: 'Calcula Primeros y Siguientes de cada no terminal. Escribe los conjuntos separados por comas (ε como "ε" o "eps").',
    theory: T_FF, custom: CUSTOM_G('S → A B\nA → a A | ε\nB → b | c'),
    create(ctx) {

      const a = Gram.analyze(g);
      const F = U.setRows(g.nts.map(A => 'Primeros(' + A + ') ='), { terms: g.ts });
      const S = U.setRows(g.nts.map(A => 'Siguientes(' + A + ') ='), { ph: 'a, #', terms: g.ts });
      return {
        statement: h('div', null, h('p', { html: 'Dada la gramática' + (g.from ? ' <span class="tag">' + esc(g.from) + '</span>' : '') + ':' }), grammarPre(g), h('p', { class: 'muted', html: symsHtml(g) + ' · axioma: <b>' + g.start + '</b>' })),
        body: h('div', null, h('h3', null, 'a) Primeros'), F.el, h('h3', null, 'b) Siguientes'), S.el),
        check() {
          const errs = []; const fv = F.values(), sv = S.values();
          g.nts.forEach((A, k) => {
            const okF = U.sameSet(fv[k], a.F[A]); F.mark(k, okF); if (!okF) errs.push(setFeedback('Primeros(' + A + ')', fv[k], a.F[A]));
            const okS = U.sameSet(sv[k], a.S[A]); S.mark(k, okS); if (!okS) errs.push(setFeedback('Siguientes(' + A + ')', sv[k], a.S[A]));
          });

  });
  function explainFirst(g, a) {

  }

  // ===================== Predicción y tabla LL(1) =====================
  App.register({
    id: 'll1', block: 'sin', exam: true, title: 'Predicción y tabla LL(1)', short: 'Primeros, Siguientes, Pred, tabla descendente y ¿es LL(1)?',
    intro: 'Como la pregunta 1 de examen: primeros, siguientes, conjuntos de predicción, tabla de análisis descendente y decidir si es LL(1).',
    theory: T_FF + T_LL, custom: CUSTOM_G('S → A + S | A\nA → ( B ) | B\nB → x | y'),
    create(ctx) {
      const g = customGrammar(ctx) || GramGen.forLL(ctx.level);
      const a = Gram.analyze(g);
      const F = U.setRows(g.nts.map(A => 'Primeros(' + A + ') ='), { terms: g.ts });
      const S = U.setRows(g.nts.map(A => 'Siguientes(' + A + ') ='), { ph: 'a, #', terms: g.ts });
      const P = U.setRows(g.rules.map((r, i) => 'Pred(' + (i + 1) + ': ' + esc(Gram.ruleStr(r)) + ') ='), { ph: 'a, b', terms: g.ts });

      const isLL = U.choice(['Sí, es LL(1)', 'No, no es LL(1)']);
      const why = h('p', { class: 'muted' });
      return {
        statement: h('div', null, h('p', { html: 'Dada la gramática' + (g.from ? ' <span class="tag">' + esc(g.from) + '</span>' : '') + ' (reglas numeradas):' }), grammarPre(g, { numbered: true }), h('p', { class: 'muted', html: symsHtml(g) })),
        body: h('div', null,
          h('h3', null, 'a) Primeros'), F.el, h('h3', null, 'b) Siguientes'), S.el,
          h('h3', null, 'c) Conjuntos de predicción'), P.el,
          h('h3', null, 'd) Tabla de análisis descendente'), h('p', { class: 'muted', html: 'En cada celda escribe el <b>número de regla</b> (o la regla). Si hay más de una, sepáralas con <b>/</b>. Deja vacías las celdas de error.' }), T.el,

        check() {

          return errs.length ? { ok: false, html: 'Revisa:' + U.list(errs) } : { ok: true, html: '¡Todo correcto!' + (a.ll1 ? '' : ' Bien visto el conflicto: ' + a.conflicts.map(c => 'M[' + c.A + ', ' + c.a + '] = {' + c.rules.map(x => x + 1).join(', ') + '}').join('; ')) };
        },

          d.appendChild(U.table(g.rules.map((r, i) => (i + 1) + ') ' + Gram.ruleStr(r)), ['Pred'], (r) => U.setStr(a.P[r], [...g.ts, END])));

  function parseLLCell(s, g, A) {
    s = String(s || '').trim();
    if (!s || s === '-') return [];
    const out = [];
    for (let part of s.split('/')) {
      part = part.trim(); if (!part) continue;
      if (/^\d+$/.test(part)) { out.push(+part - 1); continue; }
      let rhs = part;
      const m = U.normRule(part).split(' → ');
      if (m.length === 2) { if (m[0].trim() !== A) return null; rhs = m[1]; }
      const syms = rhs.split(/\s+/).filter(x => x && !/^(ε|eps|λ)$/i.test(x));
      const known = new Set([...g.nts, ...g.ts]);

      if (idx < 0) return null; out.push(idx);
    }
    return [...new Set(out)].sort();
  }

  // ===================== Traza LL(1) =====================
  App.register({
    id: 'lltrace', block: 'sin', title: 'Traza del análisis LL(1)', short: 'Pila, entrada y acción paso a paso',
    intro: 'Con la tabla LL(1) dada, simula el analizador descendente: en cada paso escribe la acción (la regla que se aplica, <b>extraer</b>, <b>aceptar</b> o <b>error</b>).',
    theory: T_LL, custom: CUSTOM_G("E → T E'\nE' → + T E' | ε\nT → F T'\nT' → * F T' | ε\nF → ( E ) | id"),
    create(ctx) {
      let g, a, w, res;

        g = customGrammar(ctx) || GramGen.forLL(ctx.level, Math.random, { wantLL1: true, bankProb: 0.4 });

  // ===================== Colección canónica LR(0) =====================
  function parseItem(line, C) {
    const aug = C.aug; const g = aug.g;
    let s = line.trim().replace(/::=|-+>|→|=>/, '→');
    if (!s) return null;
    const dotChars = ['•', '·', '∙', '●'];
    let dot = dotChars.find(d => s.includes(d));
    if (!dot && s.includes('.') && !g.ts.includes('.')) dot = '.';
    if (!dot) return { err: 'falta el punto (•) en "' + line.trim() + '"' };
    const k = s.indexOf('→'); if (k < 0) return { err: 'falta la flecha en "' + line.trim() + '"' };
    const lhs = s.slice(0, k).trim();
    const rhsTxt = s.slice(k + 1);
    const parts = rhsTxt.split(dot);
    if (parts.length !== 2) return { err: 'debe haber exactamente un punto en "' + line.trim() + '"' };
    const known = new Set([...g.nts, ...g.ts, aug.Sp, END]);
    const tok = t => t.trim().split(/\s+/).filter(x => x && !/^(ε|eps)$/i.test(x)).flatMap(x => Gram.splitChunk(x, known));
    const left = tok(parts[0]), right = tok(parts[1]);
    const rhs = [...left, ...right];
    const r = aug.rules.findIndex(rr => rr.lhs === lhs && rr.rhs.join(' ') === rhs.join(' '));
    if (r < 0) return { err: '"' + line.trim() + '" no corresponde a ninguna regla de la gramática' };
    return { r, d: left.length };
  }

    return { items, errs };
  }

    theory: `<h4>Derivación</h4><p>Una derivación es una secuencia de formas sentenciales en la que, en cada paso, se sustituye un no terminal por la parte derecha de una de sus reglas. En la derivación <b>por la izquierda</b> siempre se sustituye el no terminal situado más a la izquierda.</p>
      <h4>Árbol de derivación</h4><p>Representa la derivación sin fijarse en el orden de sustitución. Cada derivación por la izquierda corresponde a exactamente un árbol.</p>
      <h4>Gramática ambigua</h4><p>Una gramática es ambigua si existe <b>alguna</b> cadena con dos o más árboles de derivación distintos (equivalentemente, dos derivaciones por la izquierda distintas). Ejemplos clásicos: E → E + E | E * E | id (no fija ni precedencia ni asociatividad) y el <i>if-then-else</i> colgante.</p>
      <p>Para quitar la ambigüedad de las expresiones se introduce un no terminal por nivel de precedencia (E, T, F) y la recursividad del lado que marca la asociatividad: <span class="mono">E → E + T</span> hace que + sea asociativo por la izquierda.</p>
      <div class="tip">Una gramática LL(1) o SLR(1) nunca es ambigua. Que un analizador tenga conflictos no implica que la gramática sea ambigua.</div>`,
    create(ctx) {
      const v = ctx.variant || 'deriv';
      if (v === 'deriv') {
        const b = U.pick(GramGen.BANK.ambig.filter(b => ctx.level === 'easy' ? b.w.split(' ').length <= 4 : true));
        const g = Gram.parse(b.src);
        const sents = Tools.randomSentences(g, 5, Math.random, ctx.level === 'easy' ? 3 : ctx.level === 'medium' ? 5 : 7).filter(s => s.length);
        const w = U.pick(sents) || b.w.split(' ');
        const ta = U.code(g.start + '\n', 8, 'Una forma sentencial por línea, empezando por ' + g.start);
        return {
          statement: h('div', null, h('p', null, 'Gramática:'), grammarPre(g), h('p', { html: 'Escribe una <b>derivación por la izquierda</b> de la cadena <b class="mono">' + esc(w.join(' ')) + '</b>: una forma sentencial por línea, desde ' + g.start + ' hasta la cadena.' })),
          body: ta,
          check() {
            const known = new Set([...g.nts, ...g.ts]);
            const lines = ta.value.split('\n').map(l => l.replace(/^\s*(⇒|=>|->)\s*/, '').trim()).filter(Boolean).map(l => l.split(/\s+/).flatMap(x => Gram.splitChunk(x, known)).filter(x => x !== EPS));
            if (!lines.length || lines[0].join(' ') !== g.start) return { ok: false, html: 'La derivación debe empezar por el axioma ' + g.start + '.' };
            for (let k = 1; k < lines.length; k++) {
              const prev = lines[k - 1]; const idx = prev.findIndex(x => g.isNT(x));
              if (idx < 0) return { ok: false, html: 'La línea ' + k + ' ya no tiene no terminales.' };
              const A = prev[idx];
              const ok = g.rules.some(r => r.lhs === A && [...prev.slice(0, idx), ...r.rhs, ...prev.slice(idx + 1)].join(' ') === lines[k].join(' '));
              if (!ok) {
                const anyPos = prev.some((X, j) => g.isNT(X) && g.rules.some(r => r.lhs === X && [...prev.slice(0, j), ...r.rhs, ...prev.slice(j + 1)].join(' ') === lines[k].join(' ')));
                return { ok: false, html: 'Paso ' + k + ' → ' + (k + 1) + ': ' + (anyPos ? 'es un paso válido pero <b>no sustituye el no terminal de más a la izquierda</b> (' + A + ').' : 'no se obtiene aplicando una regla al no terminal ' + A + '.') };
              }
            }
            if (lines[lines.length - 1].join(' ') !== w.join(' ')) return { ok: false, html: 'Los pasos son correctos, pero aún no has llegado a la cadena ' + esc(w.join(' ')) + '.' };
            return { ok: true, html: '¡Derivación correcta en ' + (lines.length - 1) + ' pasos!' };
          },
          solution() { const t = Gram.oneTree(g, w); return h('div', null, h('pre', { class: 'box' }, Gram.leftmostDerivation(t).join('\n⇒ ')), h('p', null, 'Árbol:'), h('pre', { class: 'box tree' }, U.treeText(t))); }
        };
      }
      if (v === 'count') {
        const b = U.pick(GramGen.BANK.ambig);
        const g = Gram.parse(b.src);
        let w = b.w.split(' ');
        if (ctx.level !== 'easy') { const s = Tools.randomSentences(g, 8, Math.random, ctx.level === 'medium' ? 5 : 7).filter(x => x.length >= 3); if (s.length) w = U.pick(s); }
        const n = Gram.countTrees(g, w).count;
        const inp = U.input('', 'número'); inp.style.width = '100px';
        return {
          statement: h('div', null, h('p', null, 'Gramática:'), grammarPre(g), h('p', { html: '¿Cuántos árboles de derivación distintos tiene la cadena <b class="mono">' + esc(w.join(' ')) + '</b>?' })),
          body: h('div', null, inp),
          check() { const got = parseInt(inp.value, 10); return got === n ? { ok: true, html: '¡Correcto! Tiene ' + n + (n === 1 ? ' árbol.' : ' árboles, así que la gramática es ambigua.') } : { ok: false, html: 'No. Prueba a dibujar los árboles cambiando qué operación/regla queda en la raíz.' }; },
          solution() { const d = h('div', null, h('p', null, n + ' árbol(es).')); for (let k = 0; k < Math.min(n, 3); k++) { const t = Gram.oneTree(g, w, k); if (t) d.appendChild(h('pre', { class: 'box tree' }, U.treeText(t))); } return d; }
        };
      }
      // find
      const b = U.pick(GramGen.BANK.ambig);
      const g = Gram.parse(b.src);
      const isAmb = !b.unamb;
      const ch = U.choice(['Es ambigua', 'No es ambigua']);
      const inp = U.input('', 'cadena con dos árboles (símbolos separados por espacios)'); inp.style.width = '100%';
      return {
        statement: h('div', null, h('p', null, 'Gramática:'), grammarPre(g), h('p', { html: '¿Es ambigua? Si lo es, escribe una cadena que tenga al menos dos árboles de derivación.' })),
        body: h('div', null, ch.el, inp),
        check() {
          const s = ch.selected(); if (!s.length) return { ok: false, html: 'Elige una opción.' };
          if ((s[0] === 0) !== isAmb) { ch.mark([isAmb ? 0 : 1]); return { ok: false, html: isAmb ? 'Sí es ambigua: busca una cadena con dos operaciones seguidas.' : 'No es ambigua: cada cadena tiene un único árbol (las reglas fijan precedencia y asociatividad).' }; }
          if (!isAmb) return { ok: true, html: '¡Correcto! No es ambigua.' };
          const known = new Set([...g.nts, ...g.ts]);
          const w = inp.value.trim().split(/\s+/).flatMap(x => Gram.splitChunk(x, known)).filter(Boolean);
          const n = Gram.countTrees(g, w).count;
          if (n >= 2) return { ok: true, html: '¡Correcto! "' + esc(w.join(' ')) + '" tiene ' + n + ' árboles.' };
          return { ok: false, html: n === 1 ? 'Esa cadena solo tiene un árbol.' : 'Esa cadena no pertenece al lenguaje.' };
        },
        solution() { if (!isAmb) return 'No es ambigua.'; const w = b.w.split(' '); const d = h('div', null, h('p', { html: 'Por ejemplo <b class="mono">' + esc(b.w) + '</b>:' })); for (let k = 0; k < 2; k++) d.appendChild(h('pre', { class: 'box tree' }, U.treeText(Gram.oneTree(g, w, k)))); return d; }
      };
    }
  });

  // ===================== Recursividad por la izquierda y factorización =====================
  App.register({
    id: 'transform', block: 'sin', title: 'Recursividad izquierda y factorización', short: 'Preparar una gramática para el análisis LL(1)',
    variants: [{ id: 'lr', name: 'Eliminar recursividad por la izquierda' }, { id: 'fact', name: 'Factorizar por la izquierda' }],
    variantLabel: 'Transformación', levels: ['easy', 'medium', 'hard'],
    theory: `<h4>Recursividad por la izquierda</h4><p>Una regla A → A α es recursiva por la izquierda. Un analizador descendente entraría en un bucle infinito, así que hay que eliminarla. Para</p>
      <p class="mono">A → A α<sub>1</sub> | … | A α<sub>n</sub> | β<sub>1</sub> | … | β<sub>m</sub></p><p>(las β no empiezan por A) se obtiene:</p>
      <p class="mono">A → β<sub>1</sub> A' | … | β<sub>m</sub> A'<br>A' → α<sub>1</sub> A' | … | α<sub>n</sub> A' | ε</p>
      <p>Ejemplo: E → E + T | T pasa a ser E → T E' y E' → + T E' | ε.</p>
      <h4>Factorización por la izquierda</h4><p>Si dos alternativas de A empiezan igual, A → α β<sub>1</sub> | α β<sub>2</sub>, el analizador no sabe cuál escoger mirando un símbolo. Se saca el prefijo común:</p>
      <p class="mono">A → α A'<br>A' → β<sub>1</sub> | β<sub>2</sub></p>
      <div class="tip">La gramática transformada tiene que generar <b>el mismo lenguaje</b>. La app lo comprueba comparando todas las cadenas hasta cierta longitud. Usa A', B'… para los no terminales nuevos.</div>`,
    create(ctx) {
      const v = ctx.variant || 'lr';
      const g = v === 'lr' ? GramGen.forLeftRec(ctx.level) : Gram.parse(U.pick(GramGen.BANK.factor).src);
      const ref = v === 'lr' ? Gram.eliminateDirectLR(g) : Gram.leftFactor(g);
      const ta = U.code('', 6, 'Escribe la gramática transformada');
      return {
        statement: h('div', null, h('p', { html: v === 'lr' ? 'Elimina la <b>recursividad por la izquierda</b> de:' : '<b>Factoriza por la izquierda</b>:' }), grammarPre(g)),
        body: ta,
        check() {
          let u; try { u = Gram.parse(ta.value, { known: [...g.nts, ...g.ts] }); } catch (e) { return { ok: false, html: esc(e.message) }; }
          const errs = [];
          if (u.start !== g.start) errs.push('El axioma debe seguir siendo ' + g.start + ' (escríbelo en la primera línea).');
          if (v === 'lr') { const lr = Gram.leftRecursion(u); if (lr.any) errs.push('Aún hay recursividad por la izquierda en: ' + [...new Set([...lr.direct, ...lr.indirect])].join(', ')); }
          else { const nf = Gram.needsFactoring(u); if (nf.length) errs.push('Todavía hay alternativas con prefijo común en: ' + nf.map(x => x.A + ' (' + x.prefix + ')').join(', ')); }
          const cmp = Gram.compareLang(g, u, 7);
          if (!cmp.equal) {
            if (cmp.onlyA.length) errs.push('Tu gramática no genera <span class="mono">' + esc(cmp.onlyA[0] || 'ε') + '</span>, que sí está en el lenguaje original.');
            if (cmp.onlyB.length) errs.push('Tu gramática genera <span class="mono">' + esc(cmp.onlyB[0] || 'ε') + '</span>, que no está en el lenguaje original.');
          }
          if (errs.length) return { ok: false, html: U.list(errs) };
          const ll = Gram.analyze(u).ll1;
          return { ok: true, html: '¡Correcto! Genera el mismo lenguaje (comprobado hasta 7 símbolos).' + (ll ? ' Además, ahora es LL(1).' : ' Ojo: aún no es LL(1), pero la transformación pedida está bien.') };
        },
        solution() { return h('div', null, h('pre', { class: 'box' }, Gram.toText(ref))); }
      };
    }
  });
})();

(function () {

non terminal file, item_list;            // no terminales

precedence left TIMES, DIV;              // más prioridad (va después)

  // ---------- comprobación de una gramática CUP frente a otra de referencia ----------
  function wrapCup(text, terminals) {
    if (/\bterminal\b/.test(text)) return text;
    const lhs = [...new Set([...text.matchAll(/^\s*([A-Za-z_]\w*)\s*::=/gm)].map(m => m[1]))];

      const op = R(4); const i = R(s.length);

      else if (op === 1) s.splice(i, 0, s[i]);

    const pos = Tools.randomSentences(R.P.g, opts.nPos || 40, Math.random, opts.maxLen || 70);
    if (opts.bounded) {
      const cmp = Gram.compareLang(R.P.g, A.P.g, opts.bounded);
      if (cmp.onlyA.length) return { ok: false, html: 'Tu gramática <b>no acepta</b> esta secuencia válida:<pre class="box">' + esc(show(cmp.onlyA[0].split(' ').filter(Boolean))) + '</pre>' };
      if (cmp.onlyB.length) return { ok: false, html: 'Tu gramática <b>acepta</b> esta secuencia, que no es válida:<pre class="box">' + esc(show(cmp.onlyB[0].split(' ').filter(Boolean))) + '</pre>' };
    }

    const negs = negativesFrom(pos.length ? pos : [[]], R.P.terms.filter(t => t !== 'error'), acceptsR, opts.nNeg || 40);

  function randExpr(depth, vars) {

  App.register({

    theory: `<h4>Notación postfija (polaca inversa)</h4><p>El operador se escribe <b>detrás</b> de sus operandos: <span class="mono">a + b</span> → <span class="mono">a b +</span>. No necesita paréntesis porque el orden ya fija la estructura: es el recorrido en <b>postorden</b> del árbol sintáctico.</p>

t = c                if false t goto L1         label L1

  function quadsToTac(quads) {
    const lines = [];
    const REL = { '>': '>', '>=': '>=', '==': '==', '!=': '!=' };
    for (const q of quads) {
      const [c, r, a, b] = Tac.canonQuad(q).split(',');
      const ops = { add: '+', sub: '-', mult: '*', div: '/', mod: '%', and: '&&', or: '||' };
      if (ops[c]) lines.push(r + ' = ' + a + ' ' + ops[c] + ' ' + b);
      else if (REL[c]) lines.push(r + ' = ' + a + ' ' + REL[c] + ' ' + b);
      else if (c === 'assign') lines.push(r + ' = ' + a);
      else if (c === 'minus') lines.push(r + ' = - ' + a);
      else if (c === 'not') lines.push(r + ' = ! ' + a);
      else if (c === 'label') lines.push('label ' + r);
      else if (c === 'goto') lines.push('goto ' + r);
      else if (c === 'iffalse') lines.push('if false ' + r + ' goto ' + a);
      else if (c === 'if') lines.push('if ' + r + ' goto ' + a);
      else if (['read', 'write', 'push', 'halt'].includes(c)) lines.push(c === 'halt' ? 'halt' : c + ' ' + r);
      else if (c === 'call') lines.push('call ' + r);
      else if (c === 'idxget') lines.push(r + ' = ' + a + '[' + b + ']');
      else if (c === 'idxset') lines.push(r + '[' + a + '] = ' + b);
      else if (c === 'deref') lines.push(r + ' = * ' + a);
      else if (c === 'store') lines.push('* ' + r + ' = ' + a);
      else throw new Error('Operación de cuádrupla desconocida: ' + q[0]);
    }
    return lines.join('\n');
  }

t1 = 0 &lt; x           (isbigger,t1,x,0)     ← 0 &lt; x es "x es mayor que 0"
if false t1 goto L1  (if false,t1,L1,-)
fact = 1             (assign,fact,1,-)
label L2             (label,L2,-,-)
t2 = fact * x        (mult,t2,fact,x)
t4 = x == 0          (isequal,t4,x,0)
write fact           (write,fact,-,-)
halt                 (halt,-,-,-)</pre>
      <p>La app también acepta <span class="mono">issmaller</span>, <span class="mono">is&lt;</span>, <span class="mono">is&gt;=</span>, <span class="mono">isdistinct</span>, <span class="mono">minus</span> (menos unario), <span class="mono">push</span>, <span class="mono">call</span>, y para vectores <span class="mono">(idxget,x,a,i)</span> y <span class="mono">(idxset,a,i,x)</span>.</p>

      <p>No hay temporales: el resultado de una operación se nombra por su número, <span class="mono">(4)</span>. Si el resultado va a una variable del programa se añade un <span class="mono">assign</span>. Las etiquetas desaparecen y los saltos apuntan al número del terceto destino:</p>

(5) (assign,fact,(4))
(9) (if false,(8),(4))</pre>

// ===== Optimización: bloques básicos, optimizaciones individuales y cadena completa (PEC3) =====
(function () {
  const { h, div, btn, esc } = U;
  const numbered = code => code.map((ins, k) => String(k + 1).padStart(2, '0') + '  ' + Tac.fmt(ins)).join('\n');

  // ---------- generador de programas con oportunidades de optimización ----------
  function optProgram() {
    const R = U.R, P = U.pick;
    const [a, b] = U.sample(['a', 'b', 'x', 'y', 'p', 'q'], 2);
    const [s, i, n, k, d, t, u] = U.shuffle(['s', 'i', 'n', 'k', 'd', 't', 'u', 'm', 'r', 'w']).slice(0, 7);
    const c1 = 2 + R(8), c2 = 2 + R(20);
    const op = P(['*', '+']);
    const lines = [];
    lines.push(`${n} = ${c1} * ${c2};`);                       // cálculo previo de constantes
    lines.push(`${k} = ${n};`);                                 // copia
    lines.push(`${s} = 0;`);
    lines.push(`${i} = 0;`);
    lines.push(`while (${i} < ${k}) {`);
    lines.push(`    ${t} = ${a} ${op} ${b};`);                  // invariante
    lines.push(`    ${s} = ${s} + ${t} + (${a} ${op} ${b});`);    // subexpresión común
    if (Math.random() < 0.5) lines.push(`    ${u} = ${i} * ${P([2, 3, 4])};`); // muerto (u no se usa)
    lines.push(`    ${i} = ${i} + ${P([1, 1, 2])};`);
    lines.push('}');
    lines.push(`${d} = ${s} * 2;`);                             // muerto
    lines.push(`write(${s});`);
    return lines.join('\n');
  }
  function straightProgram() {
    const [a, b, c] = U.sample(['a', 'b', 'c', 'x', 'y'], 3);
    const [r1, r2, r3, r4] = U.sample(['p', 'q', 'r', 's', 't', 'u'], 4);
    const k1 = 2 + U.R(9), k2 = 1 + U.R(9);
    return [`${r1} = ${k1} + ${k2};`, `${r2} = ${a} * ${b} + ${r1};`, `${r3} = ${r1};`, `${r4} = ${a} * ${b} - ${r3} * ${c};`, `${r1} = ${r4} + 1;`, `write(${r2} + ${r4});`].join('\n');
  }
  const OPTS = {
    fr: { name: 'Reducción de frecuencia', apply: c => Tac.frequencyReduction(c), done: c => Tac.fmtAll(Tac.frequencyReduction(c)) === Tac.fmtAll(c), hint: 'Aún hay dentro del bucle algún cálculo cuyos operandos no cambian en el bucle: sácalo antes de la etiqueta del bucle.' },
    cf: { name: 'Cálculo previo de constantes', apply: c => Tac.constantFolding(c), done: c => !Tac.constantFolding(c).some(i => i.changed), hint: 'Aún hay operaciones cuyos operandos son constantes conocidas en ese punto: calcúlalas.' },
    cse: { name: 'Eliminación de subexpresiones comunes', apply: c => Tac.cse(c), done: c => !Tac.cse(c).some(i => i.changed), hint: 'Hay una expresión que se vuelve a calcular con los mismos operandos sin que hayan cambiado: reutiliza el temporal anterior.' },
    cp: { name: 'Propagación de copias', apply: c => Tac.copyPropagation(c), done: c => !Tac.copyPropagation(c).some(i => i.changed), hint: 'Hay usos de una variable que es copia de otra (x = y) o de una constante que todavía se pueden sustituir.' },
    dc: { name: 'Eliminación de código muerto', apply: (c, live) => Tac.deadCode(c, live), done: (c, live) => Tac.deadCode(c, live).length === c.length, hint: 'Aún hay asignaciones cuyo resultado no se usa después (y que no tienen efectos como write, push o escrituras en memoria).' }
  };
  const ORDER = ['fr', 'cf', 'cse', 'cp', 'dc'];
  function equivalent(orig, userCode, live) {
    const vars = new Set(); const defd = new Set();
    for (const ins of orig) { for (const u of Tac.uses(ins)) if (!defd.has(u) && u !== '$RET') vars.add(u); for (const d of Tac.defs(ins)) defd.add(d); }
    for (let t = 0; t < 8; t++) {
      const init = {}; for (const v of vars) init[v] = U.R(15) - 3;
      let e, g;
      try { e = Tac.run(orig, init); } catch (x) { continue; }
      try { g = Tac.run(userCode, init); } catch (x) { return 'Con ' + [...vars].map(v => v + '=' + init[v]).join(', ') + ' tu código falla: ' + x.message; }
      if (JSON.stringify(e.output) !== JSON.stringify(g.output)) return 'Con ' + [...vars].map(v => v + '=' + init[v]).join(', ') + ' el original escribe [' + e.output + '] y el tuyo [' + g.output + ']: has cambiado el comportamiento.';
      for (const v of live) if (e.env[v] !== g.env[v]) return 'La variable ' + v + ' termina con otro valor (' + g.env[v] + ' en vez de ' + e.env[v] + ').';
    }
    return null;
  }
  const T_OPT = `
    <h4>Las cinco optimizaciones de la PEC3 (en este orden)</h4>
    <ol>
      <li><b>Reducción de frecuencia</b>: sacar fuera del bucle (antes de su etiqueta) las operaciones invariantes, es decir, cuyos operandos no se modifican dentro del bucle.</li>
      <li><b>Cálculo previo de constantes</b>: calcular en compilación las operaciones cuyos operandos son constantes conocidas. <span class="mono">t1 = 4 * 25</span> → <span class="mono">t1 = 100</span>.</li>
      <li><b>Eliminación de subexpresiones comunes</b>: si una expresión ya se calculó y sus operandos no han cambiado, se reutiliza el resultado: <span class="mono">t5 = a * b</span> → <span class="mono">t5 = t2</span>.</li>
      <li><b>Propagación de copias</b>: tras <span class="mono">x = y</span> (o <span class="mono">x = 100</span>), los usos de x se sustituyen por y mientras ni x ni y cambien.</li>
      <li><b>Eliminación de código muerto</b>: borrar las asignaciones cuyo resultado no se usa nunca después. No se borran las instrucciones con efectos: write, push, call, escrituras en vectores o punteros, saltos y etiquetas.</li>
    </ol>
    <p>Las optimizaciones se aplican de forma <b>incremental</b>; si tras una se puede volver a aplicar una anterior, hay que hacerlo. Si una no se puede aplicar, se justifica.</p>
    <div class="tip">En esta app, salvo que se diga otra cosa, solo es observable lo que se escribe con <b>write</b>. La corrección ejecuta tu código y el original con varios valores de entrada, y comprueba que ya no quede nada por aplicar de la optimización pedida.</div>
    <h4>Bloques básicos</h4><p>Líderes: (1) la primera instrucción; (2) toda instrucción destino de un salto (las <span class="mono">label</span>); (3) toda instrucción que sigue a un salto (goto, if false … goto, halt). Cada bloque va de un líder hasta antes del siguiente.</p>`;

  // ===================== Bloques básicos =====================
  App.register({
    id: 'blocks', block: 'opt', title: 'Bloques básicos', short: 'Líderes y bloques de un código de tres direcciones',
    intro: 'Indica los números de línea de los <b>líderes</b> separados por comas.', levels: ['medium', 'hard', 'veryhard'],
    theory: T_OPT,
    create(ctx) {
      let code; do { code = Tac.parse(MiniC.toTAC(MiniC.parse(MiniC.generate(ctx.level).src))); } while (code.length < 8);
      const L = Tac.leaders(code).map(k => k + 1);
      const inp = U.input('', 'p. ej.: 1, 4, 9'); inp.style.width = '100%';
      return {
        statement: h('div', null, U.pre(numbered(code))),
        body: inp,
        check() {
          const got = new Set(inp.value.split(/[\s,;]+/).filter(Boolean).map(Number));
          const exp = new Set(L);
          if (U.sameSet(got, exp)) return { ok: true, html: '¡Correcto! Hay ' + L.length + ' bloques básicos.' };
          const d = U.diffSet(got, exp);
          return { ok: false, html: (d.missing.length ? 'Te faltan líderes (' + d.missing.length + '). ' : '') + (d.extra.length ? 'Sobran: ' + d.extra.join(', ') + '. ' : '') + 'Recuerda las tres reglas: primera instrucción, destinos de salto e instrucciones que siguen a un salto.' };
        },
        solution() { const bl = Tac.blocks(code); return h('div', null, h('p', null, 'Líderes: ' + L.join(', ')), U.pre(bl.map((b, i) => 'B' + (i + 1) + ': líneas ' + (b.start + 1) + '–' + (b.end + 1) + (b.succ.length ? '  → ' + b.succ.map(s => 'B' + (s + 1)).join(', ') : '')).join('\n'))); }
      };
    }
  });

  // ===================== Una optimización =====================
  App.register({
    id: 'opt', block: 'opt', exam: true, title: 'Optimizaciones de código', short: 'Aplicar una optimización concreta',
    intro: 'Aplica la optimización pedida al código de tres direcciones (lo tienes ya copiado en el editor para modificarlo).',
    variants: ORDER.map(k => ({ id: k, name: OPTS[k].name })), variantLabel: 'Optimización', levels: ['medium'],
    theory: T_OPT,
    create(ctx) {
      const key = ctx.variant || 'cf'; const O = OPTS[key];
      let code, after;
      for (let t = 0; t < 40; t++) {
        const src = key === 'cse' && Math.random() < 0.5 ? straightProgram() : optProgram();
        code = Tac.parse(MiniC.toTAC(MiniC.parse(src)));
        if (key === 'cp' || key === 'dc') code = Tac.constantFolding(code).map(i => (delete i.changed, i));
        if (key === 'dc') code = Tac.copyPropagation(code).map(i => (delete i.changed, i));
        after = O.apply(code, []);
        if (Tac.fmtAll(after) !== Tac.fmtAll(code)) break;
      }
      const ta = U.code(Tac.fmtAll(code), Math.min(24, code.length + 2));
      return {
        statement: h('div', null, h('p', { html: 'Aplica la <b>' + O.name.toLowerCase() + '</b>. Solo es observable lo que se escribe con <b>write</b>.' }), U.pre(numbered(code))),
        body: ta,
        check() {
          let u; try { u = Tac.parse(ta.value); } catch (e) { return { ok: false, html: esc(e.message) }; }
          const eq = equivalent(code, u, []); if (eq) return { ok: false, html: esc(eq) };
          if (!O.done(u, [])) return { ok: false, html: O.hint };
          if (Tac.fmtAll(u) === Tac.fmtAll(code)) return { ok: false, html: 'No has cambiado nada, y aquí sí se puede aplicar.' };
          return { ok: true, html: '¡Correcto! El código se comporta igual y ya no queda nada por aplicar de esta optimización.' };
        },
        solution() { return h('div', null, U.pre(Tac.changedText(O.apply(code, []))), h('p', { class: 'muted' }, 'Marcadas con "<-- cambia" las instrucciones afectadas.')); }
      };
    }
  });

  // ===================== Cadena completa (PEC3) =====================
  App.register({
    id: 'optchain', block: 'opt', exam: true, title: 'Cadena de optimizaciones (PEC3)', short: 'Las cinco optimizaciones en orden, paso a paso',
    intro: 'Como el ejercicio 1 de la PEC3: aplica las cinco optimizaciones en orden. Si una no se puede aplicar, deja el código igual y comprueba el paso. Cada paso parte del resultado del anterior.',
    levels: ['medium'], theory: T_OPT,
    create(ctx) {
      const code = Tac.parse(MiniC.toTAC(MiniC.parse(optProgram())));
      const steps = ORDER.map(k => ({ k, ta: null, ok: false, fb: div('') }));
      const box = div('');
      let prev = code;
      function render() {
        box.innerHTML = '';
        for (let j = 0; j < steps.length; j++) {
          const st = steps[j]; const O = OPTS[st.k];
          if (j > 0 && !steps[j - 1].ok) break;
          if (!st.ta) st.ta = U.code(Tac.fmtAll(j === 0 ? code : Tac.parse(steps[j - 1].ta.value)), Math.min(26, code.length + 3));
          box.appendChild(h('div', { class: 'step' + (st.ok ? ' done' : '') }, h('div', { class: 'stitle' }, (j + 1) + '. ' + O.name), st.ta,
            h('div', { class: 'btnrow' }, btn('Comprobar paso', () => checkStep(j), 'small'), btn('Mostrar este paso', () => { st.ta.value = Tac.fmtAll(refUpTo(j, j === 0 ? code : Tac.parse(steps[j - 1].ta.value))); checkStep(j); }, 'small ghost')), st.fb));
        }
      }
      function refUpTo(j, start) {
        let c = start;
        for (let rep = 0; rep < 4; rep++) for (let q = 0; q <= j; q++) c = OPTS[ORDER[q]].apply(c, []).map(i => (delete i.changed, i));
        return c;
      }
      function checkStep(j) {
        const st = steps[j];
        let u; try { u = Tac.parse(st.ta.value); } catch (e) { U.msg(st.fb, 'bad', esc(e.message)); return; }
        const eq = equivalent(code, u, []); if (eq) { U.msg(st.fb, 'bad', esc(eq)); return; }
        for (let q = 0; q <= j; q++) if (!OPTS[ORDER[q]].done(u, [])) { U.msg(st.fb, 'bad', (q < j ? 'Tras este paso se puede volver a aplicar la <b>' + OPTS[ORDER[q]].name.toLowerCase() + '</b>: hay que hacerlo. ' : '') + OPTS[ORDER[q]].hint); return; }
        const before = j === 0 ? code : Tac.parse(steps[j - 1].ta.value);
        const same = Tac.fmtAll(before) === Tac.fmtAll(u);
        st.ok = true; ctx.tried();
        U.msg(st.fb, 'ok', same ? 'Correcto: esta optimización <b>no se puede aplicar</b> aquí (en la PEC habría que justificarlo).' : 'Correcto.');
        if (j + 1 < steps.length && steps[j + 1].ta) steps[j + 1].ta.value = st.ta.value;
        render();
        if (steps.every(s => s.ok)) ctx.solved();
      }
      render();
      return {
        statement: h('div', null, h('p', null, 'Código de tres direcciones sin optimizar (solo es observable lo que se escribe con write):'), U.pre(numbered(code))),
        body: box,
        check() { const n = steps.filter(s => s.ok).length; return n === 5 ? { ok: true, html: '¡Las cinco optimizaciones aplicadas correctamente!' } : { ok: false, html: 'Llevas ' + n + ' de 5 pasos. Comprueba cada paso con su botón.' }; },
        solution() {
          const d = div(''); let c = code;
          ORDER.forEach((k, j) => { const n = refUpTo(j, c); d.appendChild(h('h3', null, (j + 1) + '. ' + OPTS[k].name)); d.appendChild(U.pre(Tac.fmtAll(n) === Tac.fmtAll(c) ? '(no se aplica)\n' + Tac.fmtAll(n) : Tac.fmtAll(n))); c = n; });
          return d;
        }
      };
    }
  });
})();

document.addEventListener('DOMContentLoaded', function () { App.start(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
</body>
